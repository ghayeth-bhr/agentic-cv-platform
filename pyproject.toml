[project]
name = "agentic-cv-platform"
version = "0.1.0"
description = "Agentic computer-vision platform for detection and segmentation datasets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "PyJWT[crypto]>=2.9",
    "boto3>=1.35",
    "pika>=1.3",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
agentic-cv = "agentic_cv.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "postgres: requires AGENTIC_CV_TEST_POSTGRES_DSN pointing at a live PostgreSQL",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_cv"]

[tool.hatch.build.targets.wheel.force-include]
"src/agentic_cv/web" = "agentic_cv/web"
