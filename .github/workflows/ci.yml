name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install the project plus its declared dev group (pyproject.toml:
      # pytest, httpx, pycocotools, playwright) instead of a hand-picked list,
      # so a new test dependency cannot silently break collection again.
      # pip >= 25.1 understands dependency groups (PEP 735).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      # The browser journeys (Playwright) skip without a browser; install one
      # so CI exercises the real UI too.
      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium

      - name: Compile sources and tests
        run: python -m compileall -q src/agentic_cv tests

      - name: Run default test suite
        run: python -m pytest -q
