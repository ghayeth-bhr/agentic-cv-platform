services:
  api:
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "8000", "--data-dir", "/data"]
    ports:
      - "8000:8000"
    volumes:
      - agentic_cv_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  export-worker:
    build: .
    command: ["worker", "--data-dir", "/data", "--worker-id", "export-worker-1", "--poll-interval", "1"]
    volumes:
      - agentic_cv_data:/data
    depends_on:
      api:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-local-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  agentic_cv_data:
  minio_data:
